[package]
name = "ls-http"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# The one place that owns the outbound TLS policy: rustls with the ring provider, the OS trust
# store, TLS 1.2 + 1.3, no redirects, no proxy from the environment.
[features]
blocking = ["reqwest/blocking"]

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"

[dev-dependencies]
tokio = { version = "1.54", features = ["rt", "macros"] }
wiremock = { workspace = true }
