[project]
name = "locksmith-agent"
version = "0.0.1"
description = "Thin Locksmith agent client: holds the agent's identity, never a secret value."
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/locksmith_agent"]

[tool.pytest.ini_options]
testpaths = ["tests", "example"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 110
