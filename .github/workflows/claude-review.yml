name: claude-review

# The `merge-ready` commit status, a required check on main (merge policy: claude-ai-crew prompts/merge-policy.md). PRs merge through GitHub
# auto-merge: the author (or the lead, on a worker PR) runs `gh pr merge --auto --merge`, which starts this job;
# GitHub merges once every required check is green. A push to a PR with auto-merge on re-runs it.
# The status is set only here, so a PR whose job never ran has no status and cannot merge (a skipped job would
# count as passing; a missing status does not). It checks, in order:
#   1. owner PRs on a non-claude/* branch pass (the owner reviews their own work);
#   2. owned paths (main's .github/CODEOWNERS, last match wins) need the owner's approval of this head (or of a head with the same PR diff); an owner
#      review re-runs the job;
#   3. complete: every tasks.md the PR touches is fully ticked (planning-only PRs exempt, #112);
#   5. reviewer by risk (scripts/review-tier.sh): Opus for secret paths and the trust root, Sonnet for other code,
#      none for docs/planning-only diffs (merge-ready passes on CI and the guard alone);
#   4. review: an independent Claude review posts "merge-review <sha>: PASS|FAIL"; a PASS for an earlier
#      head still counts while the PR's own diff (patch-id against main) is unchanged, e.g. after merging main in.
# Plus on-demand @claude mentions from people with write access.
on:
  pull_request:
    types: [auto_merge_enabled, synchronize]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]

jobs:
  review:
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'pull_request_review') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'auto_merge_enabled' || github.event.pull_request.auto_merge != null) &&
      (github.event_name != 'pull_request_review' || github.event.review.user.login == (vars.OWNER_LOGIN || 'tomer555'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Job-level so bot comments on the PR (issue_comment events) can't cancel a running review.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
      id-token: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      N: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
      OWNER: ${{ vars.OWNER_LOGIN || 'tomer555' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - id: bots
        # App bots that may open PRs: the single place to edit.
        run: |
          echo "list=captain-america-locksmith,hulk-locksmith,iron-man-locksmith,locksmith-ada,locksmith-alfie,locksmith-harriet,locksmith-josie,locksmith-linus,locksmith-walt,nick-fury-locksmith,spider-man-locksmith,thor-locksmith" >>"$GITHUB_OUTPUT"
      - id: pre
        run: |
          st() { gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f context=merge-ready -f state="$1" -f description="$2" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null; }
          for l in review-passed review-failed; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$N/labels/$l" >/dev/null 2>&1 || true
          done
          # Owner PRs on owner branches only: agents push claude/* and may post as the owner while identities are paused.
          [ "$AUTHOR" = "$OWNER" ] && [[ "$HEAD_REF" != claude/* ]] && { st success "owner PR"; echo done=1 >>"$GITHUB_OUTPUT"; exit 0; }
          git fetch -q origin main
          # 2 owned paths: patterns from main's CODEOWNERS (never the PR's copy)
          owned=""
          while read -r f; do
            o=""
            while read -r pat owners; do
              case "$pat" in ''|'#'*) continue ;; esac
              g=${pat#/}; [[ "$g" == */ ]] && g="$g*"
              # shellcheck disable=SC2053
              [[ "$f" == $g ]] && o=$owners
            done < <(git show origin/main:.github/CODEOWNERS)
            [ -n "$o" ] && owned="$owned $f"
          done < <(git diff --name-only origin/main...HEAD)
          pid() { git diff "$(git merge-base origin/main "$1")" "$1" | git patch-id --stable | cut -d' ' -f1; }
          if [ -n "$owned" ]; then
            # An approval holds while the PR's own diff is unchanged (same rule as a review PASS in step 4),
            # so merging main in does not ask the owner again.
            ok=""
            for c in $(gh api "repos/$GITHUB_REPOSITORY/pulls/$N/reviews?per_page=100" --paginate \
                -q ".[]|select(.user.login==\"$OWNER\" and .state==\"APPROVED\")|.commit_id" | sort -u); do
              if [ "$c" = "$SHA" ] || { { git cat-file -e "$c^{commit}" 2>/dev/null || git fetch -q origin "$c" 2>/dev/null; } &&
                 [ "$(pid "$c")" = "$(pid HEAD)" ]; }; then ok=$c; break; fi
            done
            [ -n "$ok" ] || { st failure "owned paths need the owner's approval:${owned:0:100}"; echo "::error::needs owner approval:$owned"; exit 1; }
          fi
          # 3 complete
          if [[ "$HEAD_REF" == claude/planning-* ]] && ! git diff --name-only origin/main...HEAD | grep -qv '^openspec/changes/'; then :
          else
            for f in $(git diff --name-only origin/main...HEAD -- 'openspec/changes/*/tasks.md'); do
              [ -f "$f" ] && grep -qE '^\s*- \[ \]' "$f" && { st failure "unchecked tasks in $f"; echo "::error::unchecked tasks in $f"; exit 1; }
            done
          fi
          # 4 an earlier PASS still applies if the PR's own diff is unchanged
          v=$(gh api "repos/$GITHUB_REPOSITORY/issues/$N/comments?per_page=100" --paginate \
            -q '.[]|select(.user.type=="Bot" and (.user.login|startswith("claude")))|.body|split("\n")[0]|select(startswith("merge-review "))' | tail -1)
          vsha=$(sed -nE 's/^merge-review ([0-9a-f]{7,40}): PASS.*/\1/p' <<<"$v")
          if [ -n "$vsha" ] && { git cat-file -e "$vsha^{commit}" 2>/dev/null || git fetch -q origin "$vsha" 2>/dev/null; } &&
             [ "$(pid "$vsha")" = "$(pid HEAD)" ]; then
            st success "review PASS for $vsha still applies"; echo done=1 >>"$GITHUB_OUTPUT"; exit 0
          fi
          # 5 reviewer by risk (main's scripts/review-tier.sh, never the PR's; missing on main -> opus)
          { git show origin/main:scripts/review-tier.sh >"$RUNNER_TEMP/review-tier.sh" &&
            tier=$(git diff --name-only origin/main...HEAD | bash "$RUNNER_TEMP/review-tier.sh"); } 2>/dev/null || tier=opus
          case "$tier" in
            none) st success "no model review: docs or planning only"; echo done=1 >>"$GITHUB_OUTPUT"; exit 0 ;;
            sonnet) echo model=claude-sonnet-5-5 >>"$GITHUB_OUTPUT" ;;
            *) echo model=claude-opus-5-5 >>"$GITHUB_OUTPUT" ;;
          esac
          echo "::notice::review tier $tier"
          st pending "Claude review running ($tier)"
      - if: steps.pre.outputs.done != '1'
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/merge-review ${{ github.event.pull_request.number }} ${{ github.event.pull_request.head.sha }}"
          show_full_output: true
          allowed_bots: ${{ steps.bots.outputs.list }}
          claude_args: >-
            --model ${{ steps.pre.outputs.model }} --max-turns 40
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(git diff:*),Bash(git log:*),mcp__github_inline_comment__create_inline_comment"
      # Review spend as a check annotation, so the optimizer can count tokens per PR from the API.
      - if: steps.pre.outputs.done != '1' && !cancelled() && steps.review.outputs.execution_file != ''
        continue-on-error: true
        env:
          EXEC: ${{ steps.review.outputs.execution_file }}
        run: |
          u=$(jq -r '[.[]|select(.type == "result")][-1]|"turns=\(.num_turns // "?") in=\(.usage.input_tokens // 0) cache_read=\(.usage.cache_read_input_tokens // 0) cache_write=\(.usage.cache_creation_input_tokens // 0) out=\(.usage.output_tokens // 0) cost_usd=\(.total_cost_usd // "?")"' "$EXEC")
          echo "::notice title=review usage::model=${{ steps.pre.outputs.model }} $u"
          echo "review usage: model=${{ steps.pre.outputs.model }} $u" >>"$GITHUB_STEP_SUMMARY"
      - if: steps.pre.outputs.done != '1' && !cancelled()
        run: |
          st() { gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f context=merge-ready -f state="$1" -f description="$2" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null; }
          v=$(gh api "repos/$GITHUB_REPOSITORY/issues/$N/comments?per_page=100" --paginate \
            -q '.[]|select(.user.type=="Bot" and (.user.login|startswith("claude")))|.body|split("\n")[0]|select(startswith("merge-review "))' | tail -1)
          vsha=$(sed -nE 's/^merge-review ([0-9a-f]{7,40}): (PASS|FAIL).*/\1/p' <<<"$v")
          res=$(sed -nE 's/^merge-review ([0-9a-f]{7,40}): (PASS|FAIL).*/\2/p' <<<"$v")
          if [ -z "$vsha" ] || [[ "$SHA" != "$vsha"* ]]; then st error "no review verdict for $SHA"; exit 1; fi
          # Labels are informational; the crew's wake workflow wakes the PR's author when this run ends.
          label=review-passed; [ "$res" = PASS ] || label=review-failed
          gh api "repos/$GITHUB_REPOSITORY/issues/$N/labels" -f "labels[]=$label" >/dev/null
          if [ "$res" = PASS ]; then st success "Claude review PASS"; else st failure "Claude review FAIL: fix the findings and push"; exit 1; fi
      # A PASS (new, or still applying) covers every earlier finding: resolve the reviewer's open threads, or the
      # ruleset's thread rule keeps a passed PR blocked with no one owning it (#489).
      - if: success()
        run: |
          gh api graphql --paginate -F owner="${GITHUB_REPOSITORY%/*}" -F name="${GITHUB_REPOSITORY#*/}" -F n="$N" -f query='
            query($owner:String!,$name:String!,$n:Int!,$endCursor:String){repository(owner:$owner,name:$name){pullRequest(number:$n){
              reviewThreads(first:100,after:$endCursor){pageInfo{hasNextPage endCursor}
                nodes{id isResolved comments(first:1){nodes{author{login}}}}}}}}' \
            -q '.data.repository.pullRequest.reviewThreads.nodes[]|select((.isResolved|not) and .comments.nodes[0].author.login=="claude")|.id' |
          while read -r t; do
            gh api graphql -f id="$t" -f query='mutation($id:ID!){resolveReviewThread(input:{threadId:$id}){thread{isResolved}}}' >/dev/null
          done

  # On-demand: the owner, org members and collaborators (author_association; the public cannot trigger it) can ask @claude something in a PR or issue comment.
  mention:
    if: >-
      github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--max-turns 30"
