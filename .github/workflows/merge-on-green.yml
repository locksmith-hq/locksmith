name: merge-on-green

# Merges open PRs the moment their gates pass, with no agent run (docs/agents/merge.md). Fork PRs never reach here.
# Fires when `ci` or `claude-review` finishes on a PR, when a PR gets the ready-to-merge label, or when a
# labelled PR gets a push (the only triggers while the owner has those workflows disabled; the gate then skips
# their checks; without the push trigger a PR that failed the gate at label time never merged, #259), and runs scripts/merge-gate.sh from main with MERGE_ON_GREEN=1:
# - owner (non-claude/*) branches: no label or review; merges once tasks are complete and CI is green (owner 2026-11-18);
# - agent (claude/*) branches: the full gate, so they merge only after ready-to-merge and a claude-review PASS.
# Budget: ~1 billed Linux minute per run.
# workflow_run always uses this file from main, so a PR cannot change what runs here.
# Merging needs GH_AUTOMATION_TOKEN (Contents and Pull requests: write): a merge made with GITHUB_TOKEN
# would not trigger main's ci or change-sync.
on:
  workflow_run:
    workflows: [ci, claude-review]
    types: [completed]
  # pull_request_target runs this file from main, never the PR's copy; same-repo PRs only (job `if`).
  pull_request_target:
    types: [labeled, synchronize]

permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: read
  actions: read

jobs:
  merge:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.pull_requests[0] != null) ||
      (github.event_name == 'pull_request_target' &&
       (github.event.label.name == 'ready-to-merge' ||
        (github.event.action == 'synchronize' &&
         contains(github.event.pull_request.labels.*.name, 'ready-to-merge'))) &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: merge-on-green-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
      cancel-in-progress: false
    env:
      PR: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      # The gate checks out the PR head and runs its task guard, so it gets only the read-only job token.
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_ON_GREEN: '1'
        run: |
          cp scripts/merge-gate.sh "$RUNNER_TEMP/merge-gate.sh"
          # A gate miss (not ready yet) is normal: print why and stay green instead of failing under bash -e.
          out=$(bash "$RUNNER_TEMP/merge-gate.sh" "$PR" 2>&1) || true; echo "$out"
          sha=$(sed -nE 's/^GATE PASS ([0-9a-f]{40})$/\1/p' <<<"$out")
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      - if: steps.gate.outputs.sha != ''
        env:
          GH_TOKEN: ${{ secrets.GH_AUTOMATION_TOKEN }}
          SHA: ${{ steps.gate.outputs.sha }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::warning::GH_AUTOMATION_TOKEN missing; the worker will merge #$PR"; exit 0; }
          gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/$PR/merge" -f merge_method=merge -f sha="$SHA" -q .message ||
            echo "::warning::merge of #$PR at $SHA failed; the worker will retry"
