name: change-sync

# Keeps GitHub's issues in step with the roadmap and OpenSpec: one issue per change (status page,
# status:* label, board Status), a milestone per phase, a sub-issue per task, blocked-by links. Hygiene only:
# no build or test, seconds of Actions time.
on:
  push:
    branches: [main, "claude/change-*"]
    paths: ["openspec/**", "docs/roadmap.md"]
  issues:
    types: [labeled, unlabeled, closed, reopened]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, closed, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: change-sync
  cancel-in-progress: false

jobs:
  sync:
    # Only issue events that change a change's state; ignore the bot's own status:* label edits.
    # Lock comments (LOCK/UNLOCK on a change issue) update the "claimed" state.
    if: >-
      (github.event_name != 'issues' && github.event_name != 'issue_comment') ||
      (github.event_name == 'issues' && (contains(fromJSON('["needs-owner","needs-rescue"]'), github.event.label.name) || github.event.action == 'closed' || github.event.action == 'reopened')) ||
      (github.event_name == 'issue_comment' && contains(github.event.issue.labels.*.name, 'change') && (startsWith(github.event.comment.body, 'LOCK ') || startsWith(github.event.comment.body, 'UNLOCK ')))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - env:
          GH_TOKEN: ${{ github.token }}
          # Automation PAT (owner-managed). Used only for the org Project; absent = labels only.
          GH_AUTOMATION_TOKEN: ${{ secrets.GH_AUTOMATION_TOKEN }}
        run: |
          git fetch -q --depth=1 origin '+refs/heads/claude/change-*:refs/remotes/origin/claude/change-*' || true
          bash scripts/change-sync.sh
          # Milestones, planned changes, task sub-issues and blocked-by links: not needed for lock
          # comments or PR events, which only change a change's state.
          case "${{ github.event_name }}" in issue_comment|pull_request) ;; *) bash scripts/roadmap-sync.sh ;; esac
