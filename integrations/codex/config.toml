[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "command -v smith >/dev/null 2>&1 || { echo 'Locksmith hook unavailable: run smith doctor' >&2; exit 2; }; smith hook codex PreToolUse"
timeout = 10

[[hooks.UserPromptSubmit]]

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "command -v smith >/dev/null 2>&1 || { echo 'Locksmith hook unavailable: run smith doctor' >&2; exit 2; }; smith hook codex UserPromptSubmit"
timeout = 10
