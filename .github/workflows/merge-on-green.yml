name: merge-on-green

# Merges a ready-to-merge PR as soon as its last gate turns green, with no agent run (docs/agents/merge.md).
# Fires when `ci` or `claude-review` finishes on a PR, runs scripts/merge-gate.sh from main, and merges the
# reviewed SHA on GATE PASS. Anything else is left for the worker. Budget: ~1 billed Linux minute per run;
# runs without the ready-to-merge label stop at the first step.
# workflow_run always uses this file from main, so a PR cannot change what runs here.
# Merging needs GH_AUTOMATION_TOKEN (Contents and Pull requests: write): a merge made with GITHUB_TOKEN
# would not trigger main's ci or change-sync.
on:
  workflow_run:
    workflows: [ci, claude-review]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: read

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: merge-on-green-${{ github.event.workflow_run.pull_requests[0].number }}
      cancel-in-progress: false
    env:
      PR: ${{ github.event.workflow_run.pull_requests[0].number }}
    steps:
      - id: ready
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          labels=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" -q '[.labels[].name]|join(",")')
          echo "labels: $labels"
          case ",$labels," in *,ready-to-merge,*) echo "go=true" >>"$GITHUB_OUTPUT" ;; esac
      - if: steps.ready.outputs.go == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      # The gate checks out the PR head and runs its task guard, so it gets only the read-only job token.
      - if: steps.ready.outputs.go == 'true'
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp scripts/merge-gate.sh "$RUNNER_TEMP/merge-gate.sh"
          out=$(bash "$RUNNER_TEMP/merge-gate.sh" "$PR" 2>&1); echo "$out"
          sha=$(sed -nE 's/^GATE PASS ([0-9a-f]{40})$/\1/p' <<<"$out")
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      - if: steps.gate.outputs.sha != ''
        env:
          GH_TOKEN: ${{ secrets.GH_AUTOMATION_TOKEN }}
          SHA: ${{ steps.gate.outputs.sha }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::warning::GH_AUTOMATION_TOKEN missing; the worker will merge #$PR"; exit 0; }
          gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/$PR/merge" -f merge_method=merge -f sha="$SHA" -q .message ||
            echo "::warning::merge of #$PR at $SHA failed; the worker will retry"
