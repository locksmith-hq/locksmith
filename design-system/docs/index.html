<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Locksmith kit</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Azeret+Mono:wght@400;500&display=swap" />
    <script>
      // Apply the saved theme before first paint (see ThemeToggle in src/app.tsx).
      try { var t = localStorage.getItem("ls-theme"); if (t === "Light" || t === "Dark") document.documentElement.dataset.theme = t.toLowerCase(); } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app.tsx"></script>
  </body>
</html>
