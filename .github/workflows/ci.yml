name: ci

# Budget: GitHub Free gives private repos $12/month of Actions compute
# (Linux x64 $0.006/min, Windows $0.010/min, macOS $0.062/min;
# https://docs.github.com/en/billing/concepts/product-billing/github-actions).
# PR CI therefore runs on Linux only, in as few jobs as possible, with timeouts, path filters and
# cancellation of superseded runs. macOS/Windows checks live in ci-platforms.yml (manual + tags).

on:
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', '!openspec/**']
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Cheap checks in one job: repo layout, OpenSpec task-edit guard, secret scan.
  hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
      desktop: ${{ steps.filter.outputs.desktop }}
      harness: ${{ steps.filter.outputs.harness }}
    permissions:
      contents: read
      pull-requests: read  # paths-filter lists changed files through the API
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'services/**'
              - 'tests/**'
              - 'Cargo.*'
              - 'rust-toolchain.toml'
              - 'deny.toml'
            web:
              - 'apps/**'
              - 'packages/**'
              - 'integrations/**'
              - 'package*.json'
              - '.nvmrc'
            harness:
              - 'infra/compose/**'
              - 'scripts/harness-check.sh'
            desktop:
              - 'apps/desktop/**'
              - 'crates/ls-ipc/**'
              - 'crates/ls-core/**'
              - 'packages/api-types/**'
      - run: bash scripts/tree-check.sh
      - name: OpenSpec task-edit guard
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: bash scripts/check-task-edits.test.sh && bash scripts/check-task-edits.sh
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .

  rust:
    needs: hygiene
    if: needs.hygiene.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}  # PRs read the cache; only main writes it
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - uses: EmbarkStudios/cargo-deny-action@v2

  desktop:
    needs: hygiene
    if: needs.hygiene.outputs.desktop == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: api-types are up to date
        run: |
          cargo test -p ls-ipc --features ts export_bindings
          git diff --exit-code packages/api-types
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test -w @locksmith/desktop

  web:
    needs: hygiene
    if: needs.hygiene.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  # F0 dev stack smoke test. Path-filtered so it runs only when the stack changes (Actions budget).
  harness:
    needs: hygiene
    if: needs.hygiene.outputs.harness == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Start stack and run harness check
        run: |
          if [ ! -f scripts/harness-check.sh ]; then echo "harness-check.sh not added yet; skipping"; exit 0; fi
          cp -n infra/compose/.env.example infra/compose/.env || true
          docker compose -f infra/compose/compose.yaml up -d --wait
          bash scripts/harness-check.sh
      - if: always()
        run: docker compose -f infra/compose/compose.yaml down -v || true
