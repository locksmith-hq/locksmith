name: ci-platforms

# macOS and Windows checks on every PR (standard runners are free on public repos).
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: ci-platforms-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # macOS runners have no Docker or Postgres: the `portable` profile skips stack and testcontainers tests.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.152
      - run: cargo nextest run --workspace --profile portable
      - run: cargo test --workspace --exclude ls-e2e --doc
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: tauri build (macOS app bundle)
        working-directory: apps/desktop
        run: npm exec -- tauri build --debug --bundles app --config '{"bundle":{"active":true}}'

  windows-check:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # shortcut: SQLCipher needs OpenSSL on Windows; ls-vault and smith-cli rejoin this check in GA hardening.
      - run: cargo check --workspace --exclude ls-vault --exclude smith-cli --exclude ls-ipc --exclude ls-broker --exclude locksmithd
