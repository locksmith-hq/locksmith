[package]
name = "ls-control-plane"
description = "Locksmith control-plane API service (axum)."
edition.workspace = true
version.workspace = true
license = "AGPL-3.0-only"
publish.workspace = true

[lints]
workspace = true

[lib]
name = "ls_control_plane"
path = "src/lib.rs"

[[bin]]
name = "locksmith-api"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7.1", features = ["request-id", "timeout", "limit", "trace", "cors"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-log = "0.2.0"
secrecy = "0.10"
time = { version = "0.3.55", features = ["serde", "formatting"] }
uuid = { version = "1.29", features = ["v4", "v5", "v7", "serde"] }
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# Not the sqlx facade: it pulls sqlx-sqlite into resolution, which conflicts with ls-vault's
# rusqlite (see crates/a0-spikes/Cargo.toml). `_rt-tokio` is the facade's `runtime-tokio`.
sqlx-core = { version = "0.9.0", default-features = false, features = ["_rt-tokio", "migrate", "uuid", "time"] }
sqlx-postgres = { version = "0.9.0", default-features = false, features = ["migrate", "uuid", "time"] }
utoipa = { version = "6.0.0", features = ["uuid"] }
utoipa-axum = "0.3.0"
opentelemetry = "0.33.1"
opentelemetry_sdk = "0.33.1"
tracing-opentelemetry = "0.34.0"
opentelemetry-appender-tracing = "0.33.1"
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "logs"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
# S2: per-version envelope encryption and the OpenBao transit DEK wrapper.
ls-envelope = { path = "../../crates/ls-envelope" }
zeroize = "1.9.1"
# S3: constant-time comparison of the gateway service token on the internal material endpoint.
subtle = "2.6.1"
# S4: agent tokens. EdDSA JWTs (RFC 8037) signed with an Ed25519 key; RustCrypto backend (no C
# build). Enrollment secrets are hashed with Argon2id through ls-crypto.
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["rust_crypto"] }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["alloc", "fast", "pkcs8", "zeroize"] }
sha2 = "0.10"
ls-crypto = { path = "../../crates/ls-crypto" }
# S5: the audit ledger (hash chain) and its Postgres store, appended inside tenant transactions.
ls-audit = { path = "../../crates/ls-audit", features = ["postgres"] }
# T1: human JWT verification. `jsonwebtoken` (above) verifies; this fetches the issuer's JWKS.
# TLS policy lives in ls-http.
ls-mcp-server = { path = "../../crates/ls-mcp-server" }
# M1 2.1: MCP protocol and Streamable HTTP transport for the hub `/mcp` route (design.md "OSS used").
rmcp = { version = "=3.11.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
ls-http = { path = "../../crates/ls-http" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
# Hashes in the audit API are shown as lowercase hex.
hex = "0.4"

[dev-dependencies]
opentelemetry_sdk = { version = "0.33.1", features = ["testing"] }
http-body-util = "0.1"
ls-tenant-lint = { path = "../../crates/ls-tenant-lint" }
similar = "3.2.1"
ls-pg-test = { path = "../../crates/ls-pg-test" }
# S5 checkpoint tests: an in-process fake of the OpenBao transit sign endpoint.
wiremock = { workspace = true }
# T1: sign test tokens with deterministic P-256 keys (already in the tree through jsonwebtoken).
p256 = "0.14"
