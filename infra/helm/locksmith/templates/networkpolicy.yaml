{{- if .Values.networkPolicy.enabled }}
{{- $n := include "locksmith.name" . -}}
# Default deny for every Locksmith pod; then allow ingress to the two service ports, gateway to
# control plane, and egress to DNS plus the configured ports.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $n }}-default-deny
  labels:
    {{- include "locksmith.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: locksmith
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $n }}-control-plane
  labels:
    {{- include "locksmith.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "locksmith.selector" (dict "root" . "component" "control-plane") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "locksmith.selector" (dict "root" . "component" "gateway") | nindent 14 }}
        {{- with .Values.networkPolicy.ingressFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - {protocol: TCP, port: {{ .Values.controlPlane.port }}}
    {{- if not .Values.networkPolicy.ingressFrom }}
    - ports:
        - {protocol: TCP, port: {{ .Values.controlPlane.port }}}
    {{- end }}
  egress:
    - ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - ports:
        {{- range .Values.networkPolicy.egressPorts }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
      {{- with .Values.networkPolicy.egressTo }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $n }}-gateway
  labels:
    {{- include "locksmith.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "locksmith.selector" (dict "root" . "component" "gateway") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- if .Values.networkPolicy.ingressFrom }}
    - from:
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        - {protocol: TCP, port: {{ .Values.gateway.port }}}
    {{- else }}
    - ports:
        - {protocol: TCP, port: {{ .Values.gateway.port }}}
    {{- end }}
  egress:
    - ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - ports:
        {{- range .Values.networkPolicy.egressPorts }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
      {{- with .Values.networkPolicy.egressTo }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if .Values.migration.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $n }}-migration
  labels:
    {{- include "locksmith.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: locksmith
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: migration
  policyTypes: [Egress]
  egress:
    - ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - ports:
        - {protocol: TCP, port: 5432}
{{- end }}
{{- end }}
