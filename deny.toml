[advisories]
yanked = "deny"
# astral-tokio-tar is only reached through testcontainers (a dev-dependency of
# ls-control-plane, used to start a throwaway Postgres in tests). It is flagged
# unmaintained, not vulnerable, and never ships in a release binary.
# Revisit when testcontainers moves off it.
ignore = ["RUSTSEC-2026-0440"]

[licenses]
allow = [
  "MIT",
  "CC0-1.0",
  "blessing",
  "WTFPL",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]

[bans]
deny = [{ name = "openssl" }, { name = "openssl-sys" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# First-party crates are checked too, so an AGPL-3.0 crate cannot become a
# dependency of an Apache-2.0 crate: only the server services below may be AGPL.
[licenses.private]
ignore = false

[[licenses.exceptions]]
name = "ls-control-plane"
allow = ["AGPL-3.0-only"]

[[licenses.exceptions]]
name = "ls-gateway"
allow = ["AGPL-3.0-only"]
