[project]
name = "locksmith-agent-google-adk"
version = "0.0.1"
description = "Locksmith MCP toolset for Google ADK agents: the allowed Agent MCP tools, never a secret value."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "locksmith-agent",
    "google-adk==2.15.1",
    # mcp 2.x moves to httpx2, so `client.auth` (an httpx.Auth) needs mcp 1.x
    "mcp==1.30.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "ruff==0.17.6",
]

[tool.uv.sources]
locksmith-agent = { path = "../agent-python" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/locksmith_agent_google_adk"]

[tool.pytest.ini_options]
testpaths = ["tests", "example"]
addopts = "-p no:cacheprovider"
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
