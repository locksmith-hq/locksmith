name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read  # paths-filter lists changed files through the API
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'services/**'
              - 'Cargo.*'
              - 'rust-toolchain.toml'
              - 'deny.toml'
            web:
              - 'apps/**'
              - 'packages/**'
              - 'integrations/**'
              - 'package*.json'
              - '.nvmrc'
            desktop:
              - 'apps/desktop/**'
              - 'package-lock.json'
              - 'crates/ls-ipc/**'
              - 'crates/ls-core/**'
              - 'packages/api-types/**'
              - 'rust-toolchain.toml'

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLCipher build deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  desktop:
    # Tauri app (own lockfile, outside the root workspace): Rust checks, the UI tests, then a
    # real `tauri build` of UI and shell (task 1.1 verify).
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri build deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: api-types are up to date
        if: runner.os == 'Linux'
        run: |
          cargo test -p ls-ipc --features ts export_bindings
          git diff --exit-code packages/api-types
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm test -w @locksmith/desktop
      - name: tauri build (macOS app bundle)
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        run: npm exec -- tauri build --debug --bundles app --config '{"bundle":{"active":true}}'
      - name: tauri build (Linux binary)
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        run: npm exec -- tauri build --debug --no-bundle

  windows-check:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # shortcut: SQLCipher needs OpenSSL on Windows; ls-vault and smith-cli rejoin this check in M16 (task 1.0).
      - run: cargo check --workspace --exclude ls-vault --exclude smith-cli --exclude ls-ipc --exclude ls-broker --exclude locksmithd  # Unix-socket daemon; Windows named pipe lands in M16

  deny:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  tree-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/tree-check.sh

  secret-scan:
    # Free stand-in for GitHub secret scanning (not available on private repos without GHAS).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .
