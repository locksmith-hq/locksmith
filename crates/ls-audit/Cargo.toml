[package]
name = "ls-audit"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The Postgres ledger store (src/pg.rs). Off by default: the core stays pure and IO-free.
postgres = ["dep:sqlx-core", "dep:sqlx-postgres", "uuid/v7"]

# Pure chain core: no IO, permissive crates only (the offline verifier ships to customers).
[dependencies]
sha2 = "0.10"
uuid = "1.29"
serde_json = "1"
# Not the sqlx facade: it pulls sqlx-sqlite into resolution, which conflicts with ls-vault's
# rusqlite (see crates/a0-spikes/Cargo.toml).
sqlx-core = { version = "0.9.0", default-features = false, features = ["_rt-tokio", "uuid"], optional = true }
sqlx-postgres = { version = "0.9.0", default-features = false, features = ["uuid"], optional = true }

[dev-dependencies]
# The checkpoint golden vector carries an Ed25519 signature (S5 design decision 4); the same
# crate and version the control plane and the verifier use.
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["alloc", "fast", "zeroize"] }
hex = "0.4"
proptest = { workspace = true }
ls-pg-test = { path = "../ls-pg-test" }
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "time"] }
