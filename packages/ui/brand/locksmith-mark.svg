<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="currentColor">
  <title>Locksmith</title>
  <!-- A pin-tumbler lock at the moment it opens: every pin stack splits on one straight shear line,
       and the line runs through the whole body. -->
  <mask id="shear"><rect width="64" height="64" fill="#fff"/><rect y="27" width="64" height="5" fill="#000"/></mask>
  <rect x="6" y="6" width="52" height="52" rx="16" fill="none" stroke="currentColor" stroke-width="6" mask="url(#shear)"/>
  <rect x="17" y="14" width="8" height="13" rx="2"/><rect x="28" y="14" width="8" height="13" rx="2"/><rect x="39" y="14" width="8" height="13" rx="2"/>
  <rect x="17" y="32" width="8" height="17" rx="2"/><rect x="28" y="32" width="8" height="10" rx="2"/><rect x="39" y="32" width="8" height="14" rx="2"/>
</svg>
