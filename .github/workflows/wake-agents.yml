name: wake-agents

# Wakes routines for the signals they can't subscribe to. CI failing on main and an owner approval
# on a needs-owner issue wake the "Locksmith worker (events)" routine; any other owner reply there
# (a demand, a change of plan, a question) wakes the Opus lead, which discusses it on the issue
# until the owner approves (scripts/owner-replies.sh classifies). The call is only a wake-up: the
# woken agent still decides from its own checks. Seconds of Actions time; skipped jobs cost nothing.
# Secrets are the routines' API trigger tokens (web UI only): ROUTINE_FIRE_TOKEN (worker events),
# LEAD_FIRE_TOKEN (lead).
on:
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  fire:
    # Agents also post as the owner, so their comments (marked) are excluded.
    if: >-
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request == null &&
       contains(github.event.issue.labels.*.name, 'needs-owner') &&
       github.event.comment.user.login == (vars.OWNER_LOGIN || github.repository_owner) &&
       !contains(github.event.comment.body, '<!-- agent -->') &&
       !contains(github.event.comment.body, 'Generated by [Claude Code]') &&
       !contains(github.event.comment.body, 'run-metadata')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'issue_comment'
        with:
          sparse-checkout: scripts/owner-replies.sh
          sparse-checkout-cone-mode: false
      - env:
          WORKER_TOKEN: ${{ secrets.ROUTINE_FIRE_TOKEN }}
          LEAD_TOKEN: ${{ secrets.LEAD_FIRE_TOKEN }}
          BODY: ${{ github.event.comment.body }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            who=worker; trig=trig_01JUGABHdyZuNMJSYdEKSfJx; token=$WORKER_TOKEN; reason="main CI failed"
          elif [ "$(printf '%s' "$BODY" | bash scripts/owner-replies.sh -)" = approval ]; then
            who=worker; trig=trig_01JUGABHdyZuNMJSYdEKSfJx; token=$WORKER_TOKEN; reason="owner approved on #$ISSUE"
          else
            who=lead; trig=trig_01QEJR9b7UBh6XeiCeAa7cv1; token=$LEAD_TOKEN; reason="owner demand on #$ISSUE: answer it on the issue (lead.md step 0)"
          fi
          echo "waking $who: $reason"
          if [ -z "$token" ]; then echo "::warning::no fire token for $who; its schedule will pick this up"; exit 0; fi
          curl -fsS -X POST "https://api.anthropic.com/v1/claude_code/routines/$trig/fire" \
            -H "Authorization: Bearer $token" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg t "wake-up: $reason" '{text: $t}')" -o /dev/null -w '%{http_code}\n'
