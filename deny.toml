[advisories]
yanked = "deny"
# astral-tokio-tar is only reached through testcontainers (a dev-dependency of
# ls-control-plane, used to start a throwaway Postgres in tests). It is flagged
# unmaintained, not vulnerable, and never ships in a release binary.
# Revisit when testcontainers moves off it.
#
# chrono comes in through oauth2 (smith login --user, device grant; T1 6.3). Flagged
# unmaintained (RUSTSEC-2026-0543), not vulnerable; oauth2 uses it for device-code expiry
# arithmetic only. Revisit when oauth2 moves off it.
ignore = ["RUSTSEC-2026-0440", "RUSTSEC-2026-0543"]

[licenses]
allow = [
  "MIT",
  "CC0-1.0",
  "blessing",
  "WTFPL",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]

[bans]
deny = [
  { name = "openssl" },
  # openssl-sys is allowed only as libsqlite3-sys's libcrypto for SQLCipher on
  # Windows (ls-vault enables bundled-sqlcipher-vendored-openssl under
  # cfg(windows) only); any other crate that pulls it in is still rejected.
  { name = "openssl-sys", wrappers = ["libsqlite3-sys"] },
  # ls-control-plane is AGPL-3.0: only the AGPL ls-gateway may depend on it, never an Apache-2.0 crate.
  { crate = "ls-control-plane", wrappers = ["ls-gateway"] },
  # ls-gateway is AGPL-3.0 and also a library: no crate may depend on it (the wrapper name matches no crate).
  { crate = "ls-gateway", wrappers = ["no-crate-may-depend-on-ls-gateway"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# First-party crates are checked too, so an AGPL-3.0 crate cannot become a
# dependency of an Apache-2.0 crate: only the server services below may be AGPL.
[licenses.private]
ignore = false

[[licenses.exceptions]]
name = "ls-control-plane"
allow = ["AGPL-3.0-only"]

[[licenses.exceptions]]
name = "ls-gateway"
allow = ["AGPL-3.0-only"]
