[advisories]
yanked = "deny"
# astral-tokio-tar is only reached through testcontainers (a dev-dependency of
# ls-control-plane, used to start a throwaway Postgres in tests). It is flagged
# unmaintained, not vulnerable, and never ships in a release binary.
# Revisit when testcontainers moves off it.
ignore = ["RUSTSEC-2026-0440"]

[licenses]
allow = [
  "MIT",
  "CC0-1.0",
  "blessing",
  "WTFPL",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]

[bans]
deny = [
  { name = "openssl" },
  # openssl-sys is allowed only as libsqlite3-sys's libcrypto for SQLCipher on
  # Windows (ls-vault enables bundled-sqlcipher-vendored-openssl under
  # cfg(windows) only); any other crate that pulls it in is still rejected.
  { name = "openssl-sys", wrappers = ["libsqlite3-sys"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# First-party crates are proprietary and unpublished; skip license checks for them.
[licenses.private]
ignore = true
