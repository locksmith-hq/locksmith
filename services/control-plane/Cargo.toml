[package]
name = "ls-control-plane"
description = "Locksmith control-plane API service (axum)."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "ls_control_plane"
path = "src/lib.rs"

[[bin]]
name = "locksmith-api"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7.1", features = ["request-id", "timeout", "limit", "trace"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
secrecy = "0.10"
uuid = { version = "1.29", features = ["v4", "v7", "serde"] }
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# Not the sqlx facade: it pulls sqlx-sqlite into resolution, which conflicts with ls-vault's
# rusqlite (see crates/a0-spikes/Cargo.toml). `_rt-tokio` is the facade's `runtime-tokio`.
sqlx-core = { version = "0.9.0", default-features = false, features = ["_rt-tokio", "migrate", "uuid"] }
sqlx-postgres = { version = "0.9.0", default-features = false, features = ["migrate", "uuid"] }
utoipa = { version = "6.0.0", features = ["uuid"] }
utoipa-axum = "0.3.0"

[dev-dependencies]
http-body-util = "0.1"
ls-tenant-lint = { path = "../../crates/ls-tenant-lint" }
similar = "3.2.1"
testcontainers = { workspace = true }
