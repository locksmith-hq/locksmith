name: wake-agents

# Wakes routines for the signals they can't subscribe to. Who wakes whom lives in docs/agents/routing.json and
# scripts/route.sh (debate turn cap included); this file only filters events cheaply and fires. Today:
# - an owner comment tagging @locksmith-lead/-pm/-worker/-research (issue or PR) -> exactly those roles;
# - needs-rescue opened -> lead; needs-research opened -> research; an untagged owner reply on needs-owner -> the
#   role that raised it (else lead); a debate turn -> the other side, or the lead to record or escalate it;
# - needs-research closed -> the role that asked; needs-rescue closed -> the worker that opened it; needs-owner closed or CI
#   failing on main -> Worker A;
# - each worker owns its PRs: a finished merge review (claude-review) or failing CI on a claude/change-* PR -> the worker
#   whose App opened the PR (owner PRs -> Worker A).
# The call is only a wake-up: the woken agent still decides from its own checks.
# Secrets are the routines' API trigger tokens (web UI only); a new role adds its secret below.
on:
  issue_comment:
    types: [created]
  issues:
    types: [labeled, closed]
  workflow_run:
    workflows: [ci, claude-review]
    types: [completed]

permissions:
  contents: read  # sparse checkout of the router
  issues: read    # debate threads
  pull-requests: read  # the PR author picks its worker

jobs:
  fire:
    # Debate turns also come from App bots (their author_association is not OWNER); route.sh reads roles from logins.
    # Cheap prefilter so most events (run-lock comments, other labels) skip without a runner.
    if: >-
      (github.event_name == 'issue_comment' &&
       (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) || github.event.comment.user.type == 'Bot') &&
       ((github.event.issue.pull_request == null && contains(github.event.issue.labels.*.name, 'debate')) ||
        (github.event.comment.user.login == (vars.OWNER_LOGIN || github.repository_owner) &&
         !contains(github.event.comment.body, '<!-- agent -->') &&
         !contains(github.event.comment.body, 'Generated by [Claude Code]') &&
         !contains(github.event.comment.body, 'run-metadata') &&
         (contains(github.event.comment.body, '@locksmith-') ||
          (github.event.issue.pull_request == null && contains(github.event.issue.labels.*.name, 'needs-owner')))))) ||
      (github.event_name == 'issues' && github.event.action == 'labeled' &&
       contains(fromJSON('["needs-rescue","needs-research","debate"]'), github.event.label.name)) ||
      (github.event_name == 'issues' && github.event.action == 'closed' &&
       (contains(github.event.issue.labels.*.name, 'needs-rescue') || contains(github.event.issue.labels.*.name, 'needs-owner') ||
        contains(github.event.issue.labels.*.name, 'needs-research'))) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'claude-review' &&
       github.event.workflow_run.event == 'pull_request' &&
       contains(fromJSON('["success","failure"]'), github.event.workflow_run.conclusion)) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'ci' && github.event.workflow_run.conclusion == 'failure' &&
       (github.event.workflow_run.head_branch == 'main' ||
        (github.event.workflow_run.event == 'pull_request' && startsWith(github.event.workflow_run.head_branch, 'claude/change-') &&
         github.event.workflow_run.head_repository.full_name == github.repository)))
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/route.sh
            docs/agents/routing.json
          sparse-checkout-cone-mode: false
      - env:
          GH_TOKEN: ${{ github.token }}
          LEAD_FIRE_TOKEN: ${{ secrets.LEAD_FIRE_TOKEN }}
          WORKER_A_FIRE_TOKEN: ${{ secrets.WORKER_A_FIRE_TOKEN }}
          WORKER_B_FIRE_TOKEN: ${{ secrets.WORKER_B_FIRE_TOKEN }}
          WORKER_C_FIRE_TOKEN: ${{ secrets.WORKER_C_FIRE_TOKEN }}
          PM_FIRE_TOKEN: ${{ secrets.PM_FIRE_TOKEN }}
          RESEARCH_FIRE_TOKEN: ${{ secrets.RESEARCH_FIRE_TOKEN }}
        run: |
          scripts/route.sh event "$GITHUB_EVENT_PATH" | while IFS=$'\t' read -r role why; do
            scripts/route.sh fire "$role" "$why"
          done
