# The `merge-ready` status (a required check on main). All logic is in the shared review workflow and the
# review config it reads. Needs CLAUDE_CODE_OAUTH_TOKEN and CREW_REPO_TOKEN (read access to the private plan repo).
name: claude-review

on:
  pull_request:
    types: [auto_merge_enabled, synchronize]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]

jobs:
  review:
    uses: locksmith-hq/claude-ai-crew/.github/workflows/review.yml@7553af63eec951ba43ef12bcbed4a68aed391044
    permissions:
      contents: write
      pull-requests: write
      issues: write
      statuses: write
      id-token: write
      actions: read
    with:
      plan_repo: locksmith-hq/locksmith-roadmap
      harness_repo: locksmith-hq/claude-ai-crew
      harness_ref: 7553af63eec951ba43ef12bcbed4a68aed391044
    secrets: inherit
