name: wake-agents

# Wakes routines for the signals they can't subscribe to (seconds of Actions time; skipped jobs cost nothing):
# - any owner reply on a needs-owner issue wakes the Opus lead, which discusses it on the issue until the owner
#   approves, then applies the plan and closes the issue (docs/agents/lead.md step 0);
# - a needs-owner issue being closed, CI failing on main, or CI failing on an agent change PR (claude/change-*) wakes the "Locksmith worker (events)" routine.
# The call is only a wake-up: the woken agent still decides from its own checks.
# Secrets are the routines' API trigger tokens (web UI only): LEAD_FIRE_TOKEN, ROUTINE_FIRE_TOKEN (worker events).
on:
  issue_comment:
    types: [created]
  issues:
    types: [closed]
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions: {}

jobs:
  fire:
    # Agents also post as the owner, so their comments (marked) are excluded.
    if: >-
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request == null &&
       contains(github.event.issue.labels.*.name, 'needs-owner') &&
       github.event.comment.user.login == (vars.OWNER_LOGIN || github.repository_owner) &&
       !contains(github.event.comment.body, '<!-- agent -->') &&
       !contains(github.event.comment.body, 'Generated by [Claude Code]') &&
       !contains(github.event.comment.body, 'run-metadata')) ||
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'needs-owner')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' &&
       (github.event.workflow_run.head_branch == 'main' ||
        (github.event.workflow_run.event == 'pull_request' && startsWith(github.event.workflow_run.head_branch, 'claude/change-'))))
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          WORKER_TOKEN: ${{ secrets.ROUTINE_FIRE_TOKEN }}
          LEAD_TOKEN: ${{ secrets.LEAD_FIRE_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            issue_comment) who=lead; trig=trig_01QEJR9b7UBh6XeiCeAa7cv1; token=$LEAD_TOKEN; reason="owner replied on needs-owner #$ISSUE (lead.md step 0)" ;;
            issues) who=worker; trig=trig_01JUGABHdyZuNMJSYdEKSfJx; token=$WORKER_TOKEN; reason="owner decision #$ISSUE settled" ;;
            *) who=worker; trig=trig_01JUGABHdyZuNMJSYdEKSfJx; token=$WORKER_TOKEN; reason="main CI failed" ;;
          esac
          [ "$GITHUB_EVENT_NAME" = workflow_run ] && [ "$RUN_BRANCH" != main ] && reason="CI failed on PR #$RUN_PR ($RUN_BRANCH)"
          echo "waking $who: $reason"
          if [ -z "$token" ]; then echo "::warning::no fire token for $who; its schedule will pick this up"; exit 0; fi
          curl -fsS -X POST "https://api.anthropic.com/v1/claude_code/routines/$trig/fire" \
            -H "Authorization: Bearer $token" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"wake-up: $reason\"}" -o /dev/null -w '%{http_code}\n'
