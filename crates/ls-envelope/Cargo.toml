[package]
name = "ls-envelope"
description = "Per-version envelope encryption: A0-7 ciphertext header, AES-256-GCM under a fresh DEK."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ls-crypto = { path = "../ls-crypto" }
# Same version ls-crypto uses; only for the random DEK id.
getrandom = "0.2"
# OpenBao transit client (design decision 3). rustls with the ring provider (already in the
# workspace) instead of reqwest's default aws-lc-rs, so no C/cmake build is added.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# Same range reqwest 0.13 uses; verifies OpenBao's certificate against the OS trust store.
rustls-platform-verifier = "0.7.1"
base64 = "0.22.1"
bytes = "1.12.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1.9.1"

[dev-dependencies]
# Fixed-nonce known-answer path only. As a dev-dependency it cannot reach a production build.
aes-gcm = "0.10"
hex = "0.4"
proptest = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54", features = ["rt", "macros"] }
trybuild = "1"
wiremock = { workspace = true }
