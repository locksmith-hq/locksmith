name: claude-review

# Independent pre-merge review by Claude (claude-code-action, Claude subscription via OAuth token).
# Runs only on PRs labelled ready-to-merge (label added, or a new push to a labelled PR), plus
# on-demand @claude mentions from people with write access. Budget: one Linux runner, 20 min cap,
# one review per PR at a time. scripts/merge-gate.sh requires the PASS verdict for the head SHA.
on:
  pull_request:
    types: [labeled, synchronize]
  issue_comment:
    types: [created]

jobs:
  review:
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'ready-to-merge') &&
      (github.event.action == 'synchronize' || github.event.label.name == 'ready-to-merge')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Job-level so bot comments on the PR (issue_comment events) can't cancel a running review.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Verdict labels only wake the event worker routine; gate 6 still reads the verdict comment.
      # Removed first so the next verdict is a fresh "labeled" event.
      - env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.pull_request.number }}
        run: |
          for l in review-passed review-failed; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$N/labels/$l" >/dev/null 2>&1 || true
          done
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/merge-review ${{ github.event.pull_request.number }} ${{ github.event.pull_request.head.sha }}"
          show_full_output: true
          claude_args: >-
            --model claude-opus-5-5 --max-turns 40
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(git diff:*),Bash(git log:*),mcp__github_inline_comment__create_inline_comment"
      - env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Same verdict lookup as merge-gate.sh gate 6.
          v=$(gh api "repos/$GITHUB_REPOSITORY/issues/$N/comments?per_page=100" --paginate \
            -q '[.[]|select(.user.type=="Bot" and (.user.login|startswith("claude")))|.body|split("\n")[0]|select(startswith("merge-review "))]|last // ""')
          vsha=$(sed -nE 's/^merge-review ([0-9a-f]{7,40}): (PASS|FAIL).*/\1/p' <<<"$v")
          res=$(sed -nE 's/^merge-review ([0-9a-f]{7,40}): (PASS|FAIL).*/\2/p' <<<"$v")
          [ -n "$vsha" ] && [[ "$SHA" == "$vsha"* ]] || { echo "no verdict for $SHA"; exit 0; }
          label=review-passed; [ "$res" = PASS ] || label=review-failed
          gh api "repos/$GITHUB_REPOSITORY/issues/$N/labels" -f "labels[]=$label" >/dev/null
          echo "labelled $label"

  # On-demand: repo owner, members and collaborators (public repo) can ask @claude something in a PR or issue comment.
  mention:
    if: >-
      github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--max-turns 30"
