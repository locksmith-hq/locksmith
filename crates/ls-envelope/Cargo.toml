[package]
name = "ls-envelope"
description = "Per-version envelope encryption: A0-7 ciphertext header, AES-256-GCM under a fresh DEK."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ls-crypto = { path = "../ls-crypto" }
# Same version ls-crypto uses; only for the random DEK id.
getrandom = "0.2"
# OpenBao transit client (design decision 3). rustls with the ring provider (already in the
# workspace) instead of reqwest's default aws-lc-rs, so no C/cmake build is added.
ls-http = { path = "../ls-http" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
base64 = "0.22.1"
bytes = "1.12.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1.9.1"
# HPKE-wrapped DEK (`alg_id` 2, t7 design decision 1): DHKEM(X25519, HKDF-SHA256), HKDF-SHA256,
# AES-256-GCM. Its getrandom feature is off: the ephemeral seed comes from getrandom 0.2.
hpke = { workspace = true }
# Verify the gateway's seal-key signature (t7 decision 2); verify only, no signing here.
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["alloc", "fast"] }

[dev-dependencies]
# Fixed-nonce known-answer path only. As a dev-dependency it cannot reach a production build.
aes-gcm = "0.10"
hex = "0.4"
proptest = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54", features = ["rt", "macros"] }
trybuild = "1"
wiremock = { workspace = true }
