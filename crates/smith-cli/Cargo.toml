[package]
name = "smith-cli"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "smith"
path = "src/main.rs"

[dependencies]
ls-core = { path = "../ls-core" }
ls-diag = { path = "../ls-diag" }
inventory = "0.3"
ls-update = { path = "../ls-update" }
ls-crypto = { path = "../ls-crypto" }
ls-platform = { path = "../ls-platform" }
ls-vault = { path = "../ls-vault" }
ls-ipc = { path = "../ls-ipc" }
ls-broker = { path = "../ls-broker" }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
rpassword = "7"
semver = "1"
serde_json = "1"
zeroize = "1"
portable-pty = "0.9.0"
signal-hook = "0.4.6"
toml = "1.2.1"
serde = { version = "1.0.229", features = ["derive"] }
ls-redact = { version = "0.0.1-alpha.4", path = "../ls-redact" }
ls-hooks = { version = "0.0.1-alpha.4", path = "../ls-hooks" }
