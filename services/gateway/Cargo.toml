[package]
name = "ls-gateway"
description = "Locksmith gateway: relays HTTP calls with a secret injected the caller never sees."
edition.workspace = true
version.workspace = true
license = "AGPL-3.0-only"
publish.workspace = true

[lints]
workspace = true

[lib]
name = "ls_gateway"
path = "src/lib.rs"

[[bin]]
name = "locksmith-gateway"
path = "src/main.rs"

# t5-honey-tokens task 3.4: p50 / p99 of the honey value scan (`cargo bench --bench honey_scan`).
[[bench]]
name = "honey_scan"
harness = false

[dependencies]
# Reused as a library (S3 design decision 1): telemetry setup, the tenant-scoped database
# handle and readiness. The gateway has no copy of them.
ls-control-plane = { path = "../control-plane" }
axum = "0.8.9"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
toml = "1.2"
uuid = { version = "1.29", features = ["serde", "v4"] }
url = "2"
# S3 task 3: decrypt (envelope + OpenBao transit), redaction and the network guard, reused as
# libraries (design decision 1).
ls-envelope = { path = "../../crates/ls-envelope" }
ls-redact = { path = "../../crates/ls-redact" }
ls-proxy = { path = "../../crates/ls-proxy" }
# TLS policy lives in ls-http.
ls-http = { path = "../../crates/ls-http" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
base64 = "0.22.1"
bytes = "1.12.1"
serde_json = "1"
zeroize = "1.9.1"
# S4 task 2.1: agent tokens verified through the control plane's JWKS. Same jsonwebtoken build as
# the control plane (RustCrypto backend, no C build); claims and validation come from
# ls_control_plane::agent_token.
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["rust_crypto"] }
time = { version = "0.3.55", features = ["serde", "parsing", "formatting"] }
pgwire = { version = "=0.42.3", default-features = false }
# D3 task 2.1: TLS on the Postgres listener, with the gateway's rustls `ring` provider.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
# M1 task 3.1: the agent MCP server (`/mcp`), same rmcp pin and features as the hub.
ls-mcp-server = { path = "../../crates/ls-mcp-server" }
rmcp = { version = "=3.11.0", default-features = false, features = ["server", "client", "transport-streamable-http-server", "transport-streamable-http-client-reqwest"] }
# M1 task 3.3: short-lived credentials are random tokens (OS RNG) kept only as SHA-256 hashes.
# Same versions the workspace already uses (ls-crypto, ls-envelope, ls-audit).
getrandom = "0.2"
sha2 = "0.10"
# t5-honey-tokens task 3.2: the multi-pattern matcher behind the honey value scan (the same crate
# ls-redact builds its automaton with; MIT OR Unlicense).
aho-corasick = "1.1.5"

[dev-dependencies]
proptest = { workspace = true }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
wiremock = { workspace = true }
ls-pg-test = { path = "../../crates/ls-pg-test" }
# S5 task 3.2: read the ledger back and walk the chain in the relay's ledger tests.
ls-audit = { path = "../../crates/ls-audit", features = ["postgres"] }
# D3 task 2.4: self-signed certificates for the Postgres listener tests (same build as ls-proxy).
testcontainers = { workspace = true }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
# t5 task 2.4: sign test human (OIDC) tokens with a deterministic P-256 key, as the control
# plane's human-auth tests do (same version, already in the tree through jsonwebtoken).
p256 = "0.14"
