[project]
name = "locksmith-agent-crewai"
version = "0.0.1"
description = "Locksmith MCP tools for CrewAI agents: the allowed Agent MCP tools, never a secret value."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "locksmith-agent",
    "crewai==1.15.45",
    "crewai-tools[mcp]==1.15.45",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.6",
]

[tool.uv.sources]
locksmith-agent = { path = "../agent-python" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/locksmith_agent_crewai"]

[tool.pytest.ini_options]
testpaths = ["tests", "example"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 110
