[package]
name = "ls-oauth"
description = "Locksmith OAuth connections: provider registry and the wire types of the gateway's OAuth endpoints. No type carries a token."
edition.workspace = true
version.workspace = true
license = "AGPL-3.0-only"
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
uuid = { version = "1.29", features = ["serde"] }

[dev-dependencies]
serde_json = "1"
