name: change-sync

# Keeps GitHub's issues in step with the roadmap and OpenSpec: one issue per change (status page,
# status:* label, board Status), a milestone per phase, a sub-issue per task, blocked-by links. Hygiene only:
# no build or test, seconds of Actions time.
on:
  push:
    branches: [main]
    paths: ["openspec/**", "docs/roadmap.md"]
  workflow_dispatch:
  schedule:
    # Every 2 hours instead of on every issue, comment and PR event: those cost ~1 billed minute
    # each (~190 min/day on 2026-11-17, against a 113 min/day budget). The board is a view only;
    # locks (run-lock.sh) and merge-gate.sh read GitHub directly, so a 2 h lag blocks nothing.
    - cron: "17 */2 * * *"

permissions:
  contents: read
  issues: write
  pull-requests: write  # managed issue-links block in change PRs

concurrency:
  group: change-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 3  # runs take ~1 min
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || 'main' }}  # manual runs can test a branch
      - env:
          GH_TOKEN: ${{ github.token }}
          # Automation PAT (owner-managed). Used only for the org Project; absent = labels only.
          GH_AUTOMATION_TOKEN: ${{ secrets.GH_AUTOMATION_TOKEN }}
        run: |
          git fetch -q --depth=1 origin '+refs/heads/claude/change-*:refs/remotes/origin/claude/change-*' || true
          bash scripts/change-sync.sh
          bash scripts/roadmap-sync.sh
          bash scripts/dates-sync.sh
