[workspace]
resolver = "3"
members = ["crates/*"]
# Tauri app: own lockfile, keeps webkit/gtk out of the core build.
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
edition = "2024"
version = "0.0.1-alpha.4"
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
