[package]
name = "ls-mcp-server"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmcp = { version = "=3.11.0", default-features = false, features = ["server", "transport-streamable-http-server"] }

[dev-dependencies]
tokio = { version = "1.54", features = ["rt", "macros"] }
