name: owner-alert

# Scheduled agents act as the owner's GitHub account, and GitHub never notifies you about your
# own activity. When an issue gets the needs-owner label, github-actions[bot] edits the issue body
# to start with an @mention of the owner, so GitHub sends an email and a mobile notification without
# a second message. A re-label (the owner must act again) removes and re-adds the mention to re-alert.
on:
  issues:
    types: [labeled]

permissions:
  issues: write

jobs:
  mention:
    if: github.event.label.name == 'needs-owner'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ vars.OWNER_LOGIN || github.repository_owner }}
          NUMBER: ${{ github.event.issue.number }}
          BODY: ${{ github.event.issue.body }}
        run: |
          url="repos/${GITHUB_REPOSITORY}/issues/${NUMBER}"
          plain="${BODY#"@${OWNER} "}"
          if [ "$plain" != "$BODY" ]; then gh api -X PATCH "$url" -f body="$plain"; fi
          gh api -X PATCH "$url" -f body="@${OWNER} ${plain}"
