name: ci

# Budget: GitHub Free gives private repos $12/month of Actions compute
# (Linux x64 $0.006/min, Windows $0.010/min, macOS $0.062/min;
# https://docs.github.com/en/billing/concepts/product-billing/github-actions).
# PR CI therefore runs ONLY lint/format plus seconds-long hygiene (layout, task guard, word budgets,
# secret scan), on Linux, with timeouts, path filters and cancellation of superseded runs.
# Tests/builds run in the agent VM (`just ci`). macOS/Windows: ci-platforms.yml (manual + tags).

on:
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', '!openspec/**']
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Cheap checks in one job: repo layout, OpenSpec task-edit guard, secret scan.
  hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
      desktop: ${{ steps.filter.outputs.desktop }}
    permissions:
      contents: read
      pull-requests: read  # paths-filter lists changed files through the API
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'services/**'
              - 'tests/**'
              - 'Cargo.*'
              - 'rust-toolchain.toml'
              - 'deny.toml'
            web:
              - 'apps/**'
              - 'packages/**'
              - 'integrations/**'
              - 'package*.json'
              - '.nvmrc'
            desktop:
              - 'apps/desktop/**'
              - 'crates/ls-ipc/**'
              - 'crates/ls-core/**'
              - 'packages/api-types/**'
      - run: bash scripts/tree-check.sh
      - name: OpenSpec task-edit guard
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: bash scripts/check-task-edits.test.sh && bash scripts/check-task-edits.sh && bash scripts/check-agent-docs.sh
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .

  # Lint and format only (owner policy, AGENTS.md "CI policy"). Tests, builds and the docker
  # stack run in the agent VM via `just ci`, which is free; the Claude review checks the result.
  rust-lint:
    needs: hygiene
    if: needs.hygiene.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}  # PRs read the cache; only main writes it
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2

  desktop-format:
    needs: hygiene
    if: needs.hygiene.outputs.desktop == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check

  web-lint:
    needs: hygiene
    if: needs.hygiene.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
