name: Locksmith login
description: >-
  Log a GitHub Actions job in to Locksmith with its OIDC identity (no stored secret) and keep a
  15-minute agent token for later `smith` steps. Requires `permissions: id-token: write`.
author: Locksmith
branding:
  icon: key
  color: gray-dark

inputs:
  policy:
    description: Workload identity policy handle (lsw_..., not a secret).
    required: true
  control-plane-url:
    description: Control plane base URL (https).
    required: true
  gateway-url:
    description: Gateway base URL (https).
    required: true
  audience:
    description: Audience to request; must equal the policy audience. Defaults to the control plane URL.
    required: false
    default: ""
  smith-version:
    description: Release of smith to install, for example 0.1.0 (pin it; there is no default).
    required: true

runs:
  using: composite
  steps:
    - name: Install smith
      shell: bash
      env:
        SMITH_VERSION: ${{ inputs.smith-version }}
        SMITH_REPO: locksmith-hq/locksmith
      run: |
        set -euo pipefail
        case "$SMITH_VERSION" in *[!A-Za-z0-9.+-]*|"") echo "invalid smith-version" >&2; exit 1 ;; esac
        case "$(uname -s)-$(uname -m)" in
          Linux-x86_64) target=x86_64-unknown-linux-gnu ;;
          Linux-aarch64|Linux-arm64) target=aarch64-unknown-linux-gnu ;;
          Darwin-arm64) target=aarch64-apple-darwin ;;
          Darwin-x86_64) target=x86_64-apple-darwin ;;
          *) echo "unsupported runner: $(uname -s)-$(uname -m)" >&2; exit 1 ;;
        esac
        base="https://github.com/${SMITH_REPO}/releases/download/v${SMITH_VERSION}"
        dir="${RUNNER_TEMP:?}/locksmith-smith"
        mkdir -p "$dir"
        curl -fsSL --retry 3 -o "$dir/manifest.json" "$base/manifest.json"
        curl -fsSL --retry 3 -o "$dir/smith" "$base/smith-${target}"
        want="$(jq -r --arg t "$target" '.targets[$t].sha256' "$dir/manifest.json")"
        if command -v sha256sum >/dev/null 2>&1; then got="$(sha256sum "$dir/smith" | awk '{print $1}')"
        else got="$(shasum -a 256 "$dir/smith" | awk '{print $1}')"; fi
        [ -n "$want" ] && [ "$want" = "$got" ] || { echo "smith checksum mismatch" >&2; exit 1; }
        chmod 0755 "$dir/smith"
        echo "$dir" >> "$GITHUB_PATH"

    - name: Log in with the job's OIDC identity
      shell: bash
      env:
        LOCKSMITH_WORKLOAD_POLICY: ${{ inputs.policy }}
        LOCKSMITH_CONTROL_PLANE_URL: ${{ inputs.control-plane-url }}
        LOCKSMITH_GATEWAY_URL: ${{ inputs.gateway-url }}
        INPUT_AUDIENCE: ${{ inputs.audience }}
      run: |
        set -euo pipefail
        if [ -n "$INPUT_AUDIENCE" ]; then export LOCKSMITH_WORKLOAD_AUDIENCE="$INPUT_AUDIENCE"; fi
        "${RUNNER_TEMP:?}/locksmith-smith/smith" login --workload github
