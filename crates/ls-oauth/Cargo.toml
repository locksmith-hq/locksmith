[package]
name = "ls-oauth"
description = "Locksmith OAuth connections: provider registry and the wire types of the gateway's OAuth endpoints. No type carries a token."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Per-provider wiremock fakes for tests (C1 task 1.3). Not part of any shipped build.
testing = ["dep:wiremock", "dep:serde_json"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1", optional = true }
wiremock = { workspace = true, optional = true }
toml = "1.2.1"
uuid = { version = "1.29", features = ["serde"] }

[dev-dependencies]
serde_json = "1"
ls-oauth = { path = ".", features = ["testing"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form"] }
tokio = { version = "1.54", features = ["rt", "macros"] }
