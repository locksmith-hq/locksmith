[package]
name = "ls-update"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ls-diag = { path = "../ls-diag" }
inventory = "0.3"
minisign-verify = "0.2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
minisign = "0.7"
