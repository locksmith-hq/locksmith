name: locksmith-dev

services:
  postgres:
    image: postgres:18.7
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-locksmith}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-locksmith-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-locksmith}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  lgtm:
    image: grafana/otel-lgtm:0.41.0
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health && curl -sf http://localhost:3100/ready"]
      interval: 5s
      timeout: 5s
      retries: 60

  openbao:
    image: ${OPENBAO_IMAGE:-openbao/openbao:2.7.2}
    # Dev mode: in-memory and auto-unsealed. The healthcheck runs openbao-init.sh (idempotent): transit,
    # the `gateway` key, and the encrypt-only / decrypt-only policies and fixed dev-only tokens
    # (s2-envelope-crypto design decision 4), plus the Ed25519 `audit-checkpoint` key and its
    # sign-only policy and token (s5-audit-ledger design decision 4). Healthy therefore means initialized, `up --wait` waits
    # for it, and a restarted (emptied) server is set up again.
    command: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200", "-dev-root-token-id=${OPENBAO_DEV_ROOT_TOKEN:-dev-only-root}"]
    cap_add: [IPC_LOCK]
    environment:
      BAO_ADDR: http://127.0.0.1:8200
      BAO_TOKEN: ${OPENBAO_DEV_ROOT_TOKEN:-dev-only-root}
      OPENBAO_CONTROL_PLANE_TOKEN: ${OPENBAO_CONTROL_PLANE_TOKEN:-dev-only-control-plane}
      OPENBAO_GATEWAY_TOKEN: ${OPENBAO_GATEWAY_TOKEN:-dev-only-gateway}
      OPENBAO_AUDIT_CHECKPOINT_TOKEN: ${OPENBAO_AUDIT_CHECKPOINT_TOKEN:-dev-only-audit-checkpoint}
      OPENBAO_CORE_TOKEN: ${OPENBAO_CORE_TOKEN:-dev-only-core}
    volumes: ["./openbao-init.sh:/openbao-init.sh:ro"]
    ports: ["127.0.0.1:8200:8200"]
    healthcheck:
      test: ["CMD", "/bin/sh", "/openbao-init.sh"]
      interval: 3s
      timeout: 10s
      retries: 20

  # B2: the Rust core service (audit, tokens, DEK wrap) for the NestJS API. Internal only: the caller
  # presents LOCKSMITH_CORE_SERVICE_TOKEN; the port is published on loopback for the host-run API and
  # `just core-check`, never on another interface. Needs the schema from `just api` for audit and
  # workload verify; wrap, tokens and checkpoints work without it.
  core:
    build: {context: ../.., dockerfile: services/core/Dockerfile}
    environment:
      LOCKSMITH_CORE_BIND: 0.0.0.0:8090
      LOCKSMITH_CORE_SERVICE_TOKEN: ${LOCKSMITH_CORE_SERVICE_TOKEN:-dev-only-core-service-token-0123456789}
      LOCKSMITH_CORE_DATABASE_URL: postgres://locksmith_app:${LOCKSMITH_APP_PASSWORD:-locksmith-app-dev-only}@postgres:5432/${POSTGRES_DB:-locksmith}
      LOCKSMITH_CORE_OPENBAO_ADDR: http://openbao:8200
      LOCKSMITH_CORE_OPENBAO_TOKEN: ${OPENBAO_AUDIT_CHECKPOINT_TOKEN:-dev-only-audit-checkpoint}
      LOCKSMITH_CORE_OPENBAO_DEK_TOKEN: ${OPENBAO_CORE_TOKEN:-dev-only-core}
      LOCKSMITH_CORE_AGENT_SIGNING_KEY: ${LOCKSMITH_CORE_AGENT_SIGNING_KEY:-AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=}
    ports: ["127.0.0.1:${LOCKSMITH_CORE_PORT:-8091}:8090"]
    depends_on:
      postgres: {condition: service_healthy}
      openbao: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8090 && printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && read -r l <&3 && [[ $$l == *200* ]]"]
      interval: 3s
      timeout: 3s
      retries: 40

  upstream:
    image: wiremock/wiremock:3.13.2
    command: ["--verbose"]
    ports: ["127.0.0.1:8089:8080"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/__admin/health"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Local AWS (STS, S3, DynamoDB, SQS, Lambda, SSM, Cognito...): https://github.com/floci-io/floci
  # Every AWS-API test by a human, worker, lead or PM runs here, never on real AWS, moto or LocalStack.
  floci:
    image: ${FLOCI_IMAGE:-floci/floci:2.5.0}
    ports: ["127.0.0.1:4566:4566"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/4566 && printf 'GET / HTTP/1.0\\r\\n\\r\\n' >&3 && read -r l <&3 && [[ $$l == HTTP* ]]"]
      interval: 3s
      timeout: 3s
      retries: 20

  # T1 local issuer (profile `auth`: `just up` starts it, `just up-lite` does not). start-dev is
  # local only. The realm is imported at first start; KC_HOSTNAME fixes the issuer URL.
  keycloak:
    profiles: ["auth"]
    image: ${KEYCLOAK_IMAGE:-keycloak/keycloak:26.0.8}
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-dev-only
      KC_HOSTNAME: http://localhost:8180
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    volumes: ["./keycloak/locksmith-realm.json:/opt/keycloak/data/import/locksmith-realm.json:ro"]
    ports: ["127.0.0.1:8180:8080"]
    depends_on:
      mailpit: {condition: service_healthy}
    healthcheck:
      # No curl in the image: speak HTTP over bash's /dev/tcp to the management port.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 60

  # Catches Keycloak's verification and reset mails: SMTP on 1025, web UI and API on 8025.
  mailpit:
    profiles: ["auth"]
    image: axllent/mailpit:v1.21.8
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
