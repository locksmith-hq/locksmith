[project]
name = "locksmith-agent-langchain"
version = "0.0.1"
description = "Locksmith tools for LangChain and LangGraph agents: the allowed Agent MCP tools, never a secret value."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "locksmith-agent",
    "langchain-core==1.8.4",
    "langgraph==1.2.24",
    "langchain-mcp-adapters==0.3.2",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "ruff==0.17.6",
]

[tool.uv.sources]
locksmith-agent = { path = "../agent-python" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/locksmith_agent_langchain"]

[tool.pytest.ini_options]
testpaths = ["tests", "example"]
addopts = "-p no:cacheprovider"
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
