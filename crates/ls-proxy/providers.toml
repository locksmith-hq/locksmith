# Built-in HTTP provider catalog (M6). Embedded in ls-proxy; `smith http providers` lists it.
#
# hosts         upstream hosts an opaque token for this provider may reach (`*.x` = subdomains)
# placement     where the credential goes: bearer (Authorization header, token replaced in place,
#               so `Bearer`, `Token`, `Bot` and bare values all work), basic (inside Basic auth),
#               header:<Name>, query:<param>; comma-separated when the SDK sends several
# base_url      canonical API base; the relay URL is http://127.0.0.1:<port>/h/<host><path>
#               (empty: per-account host such as <shop>.myshopify.com, configure it yourself)
# base_url_env  variables `smith run` sets to the relay base URL
# override      env: the official SDK reads base_url_env itself
#               config: the SDK takes a base-URL option; pass base_url_env through in code
#               none: no base-URL override; needs explicit-proxy mode (`smith http ca install`)
# keys          usual variable names, for suggestions only

[stripe]
name = "Stripe"
hosts = ["api.stripe.com", "files.stripe.com"]
placement = "bearer"
base_url = "https://api.stripe.com"
base_url_env = ["STRIPE_API_BASE"]
override = "config"
keys = ["STRIPE_SECRET_KEY", "STRIPE_API_KEY", "STRIPE_KEY"]

