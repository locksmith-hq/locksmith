[package]
name = "ls-control-plane"
description = "Locksmith control-plane API service (axum)."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "ls_control_plane"
path = "src/lib.rs"

[[bin]]
name = "locksmith-api"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7.1", features = ["request-id", "timeout", "limit", "trace"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
secrecy = "0.10"
uuid = { version = "1.29", features = ["v4", "v7"] }
http = "1"

[dev-dependencies]
http-body-util = "0.1"
