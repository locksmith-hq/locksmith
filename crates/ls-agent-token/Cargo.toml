[package]
name = "ls-agent-token"
description = "Agent tokens: short-lived EdDSA JWTs minted by the control plane and verified by the gateway (shared by the control plane and the core service)."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ls-crypto = { path = "../ls-crypto" }
base64 = "0.22"
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["alloc", "fast", "pkcs8", "zeroize"] }
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["rust_crypto"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
time = { version = "0.3.55" }
utoipa = { version = "6.0.0", features = ["uuid"] }
uuid = { version = "1.29", features = ["serde", "v7"] }
zeroize = "1.9.1"
