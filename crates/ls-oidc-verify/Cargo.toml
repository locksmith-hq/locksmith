[package]
name = "ls-oidc-verify"
description = "External OIDC token verification: JWKS cache, guarded issuer fetches, workload-token verification, abuse limits (shared by the control plane and the core service)."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.22"
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["rust_crypto"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1.29", features = ["serde", "v4", "v7"] }
tracing = "0.1"
http = "1"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "time"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
ls-http = { path = "../ls-http" }
ls-proxy = { path = "../ls-proxy" }
moka = { version = "0.12.16", default-features = false, features = ["sync"] }

[dev-dependencies]
wiremock = { workspace = true }
