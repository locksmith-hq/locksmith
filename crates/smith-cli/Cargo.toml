[package]
name = "smith-cli"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "smith"
path = "src/main.rs"

[dependencies]
ls-core = { path = "../ls-core" }
ls-diag = { path = "../ls-diag" }
inventory = "0.3"
ls-update = { path = "../ls-update" }
ls-crypto = { path = "../ls-crypto" }
ls-platform = { path = "../ls-platform" }
ls-vault = { path = "../ls-vault" }
ls-ipc = { path = "../ls-ipc" }
ls-broker = { path = "../ls-broker" }
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
rpassword = "7"
semver = "1"
serde_json = "1"
zeroize = "1"
toml = "1.2.1"
serde = { version = "1.0.229", features = ["derive"] }
ls-redact = { version = "0.0.1-alpha.4", path = "../ls-redact" }
# S4 task 3.1: remote mode against the gateway (state file, requests and redaction shared with
# locksmith-mcp in ls-connector).
ls-connector = { path = "../ls-connector" }
secrecy = "0.10"
ls-hooks = { version = "0.0.1-alpha.4", path = "../ls-hooks" }
ls-proxy = { version = "0.0.1-alpha.4", path = "../ls-proxy" }
# Human sign-in (T1 6.3): RFC 8628 device grant (`oauth2`) and OS keystore (`keyring`), same
# pins as apps/desktop (task 6.2).
oauth2 = { version = "5", default-features = false, features = ["ureq"] }
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }

# `smith run` pty relay and signal forwarding (Unix only; refused on Windows for now, x1 task 2.1).
[target.'cfg(unix)'.dependencies]
portable-pty = "0.9.0"
signal-hook = "0.4.6"

[dev-dependencies]
wiremock = { workspace = true }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
regex = "1.13.1"
