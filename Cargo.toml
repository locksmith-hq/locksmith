[workspace]
resolver = "3"
members = ["crates/*", "services/*", "tests/e2e"]
# Tauri app: own lockfile, keeps webkit/gtk out of the core build.
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
edition = "2024"
version = "0.0.1-alpha.4"
license = "UNLICENSED"
publish = false

# Test tooling (dev-dependencies only; crates opt in with `dep = { workspace = true }`).
[workspace.dependencies]
insta = { version = "1.49", features = ["json"] }
wiremock = "0.6.5"
testcontainers = "0.28"
proptest = "1.12"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
