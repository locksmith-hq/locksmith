[package]
name = "smith-cli"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "smith"
path = "src/main.rs"

[dependencies]
ls-core = { path = "../ls-core" }
ls-diag = { path = "../ls-diag" }
inventory = "0.3"
ls-update = { path = "../ls-update" }
ls-crypto = { path = "../ls-crypto" }
ls-platform = { path = "../ls-platform" }
ls-vault = { path = "../ls-vault" }
ls-ipc = { path = "../ls-ipc" }
ls-broker = { path = "../ls-broker" }
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
rpassword = "7"
semver = "1"
serde_json = "1"
zeroize = "1"
portable-pty = "0.9.0"
signal-hook = "0.4.6"
toml = "1.2.1"
serde = { version = "1.0.229", features = ["derive"] }
ls-redact = { version = "0.0.1-alpha.4", path = "../ls-redact" }
# S4 task 3.1: remote mode against the gateway. Blocking client (smith is synchronous), same
# rustls/ring/OS-trust-store setup as ls-envelope so no aws-lc-rs build is added.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "blocking"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
secrecy = "0.10"
base64 = "0.22.1"
url = "2"
ls-hooks = { version = "0.0.1-alpha.4", path = "../ls-hooks" }
ls-proxy = { version = "0.0.1-alpha.4", path = "../ls-proxy" }

[dev-dependencies]
wiremock = { workspace = true }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
regex = "1.13.1"
