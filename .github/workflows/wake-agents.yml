name: wake-agents

# Wakes the "Locksmith worker (events)" routine for the two signals routines can't subscribe to:
# the owner replying on a needs-owner issue, and CI failing on main. The call is only a wake-up:
# the worker still decides from worker-has-work.sh. Seconds of Actions time; skipped jobs cost nothing.
# Needs the ROUTINE_FIRE_TOKEN secret (the routine's API trigger token, web UI only).
on:
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  fire:
    # Agents also post as the owner, so their comments (marked) are excluded.
    if: >-
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request == null &&
       contains(github.event.issue.labels.*.name, 'needs-owner') &&
       github.event.comment.user.login == (vars.OWNER_LOGIN || github.repository_owner) &&
       !contains(github.event.comment.body, '<!-- agent -->') &&
       !contains(github.event.comment.body, 'Generated by [Claude Code]') &&
       !contains(github.event.comment.body, 'run-metadata')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          TOKEN: ${{ secrets.ROUTINE_FIRE_TOKEN }}
          REASON: ${{ github.event_name == 'workflow_run' && 'main CI failed' || 'owner replied on a needs-owner issue' }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::warning::ROUTINE_FIRE_TOKEN not set; hourly workers will pick this up"; exit 0; fi
          curl -fsS -X POST https://api.anthropic.com/v1/claude_code/routines/trig_01JUGABHdyZuNMJSYdEKSfJx/fire \
            -H "Authorization: Bearer $TOKEN" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"wake-up: $REASON\"}" -o /dev/null -w '%{http_code}\n'
