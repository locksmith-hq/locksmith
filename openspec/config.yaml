schema: spec-driven

context: |
  Locksmith: open-source secrets platform and credential gateway for AI coding agents.
  Core promise: agents perform authenticated operations without ever holding the real credential.
  Canonical repo: https://github.com/locksmith-hq/locksmith. Roadmap: docs/roadmap.md.
  Competitive reference: docs/research/infisical.md. Building blocks: docs/research/oss-building-blocks.md.

  Monorepo layout (fixed; scripts/tree-check.sh enforces it):
    crates/ Rust libs and binaries · services/ Rust (axum) backends · apps/ web, docs, console, desktop
    packages/ shared TS · integrations/ thin agent/IDE/CI plugins · infra/ compose, helm, OpenTofu
    tests/ e2e and adversarial · docs/ internal docs and research

  Stack (decided): Rust for everything touching secrets, keys, proxies, auth and all services;
  Postgres as the only required datastore; React + TypeScript console; Tauri desktop; OpenTelemetry.
  npm workspaces only, never pnpm or yarn. One task runner: `just`.

  Decided foundations: openspec/decisions.md (append-only, owner-approved). Read it before any proposal,
  design or task; never contradict a line there without a new owner decision.

  Licence: AGPL-3.0 for server components, Apache-2.0 for SDKs, CLI, plugins and schemas. No `ee/`.

  Non-negotiable security rules:
  - Never print, log, serialize or return a plaintext secret on any path an agent can read.
  - Plaintext lives in `secrecy`/`zeroize` types only; no Debug/Display/Clone on them.
  - Agent identities never receive secret values: relay, delegation or short-lived scoped credentials only.
  - Never hold user secrets hostage: licensing, billing or update failures never block export or self-host.
  - Label every protection honestly as prevention, containment or detection.

  Engineering principles (owner-mandated):
  - Decide from evidence, never guesses. Cite a source URL, benchmark, spike result or prior art.
  - Do not reinvent the wheel. Before writing a component, look for a free, maintained,
    licence-compatible open-source package (MIT/Apache/BSD/MPL/ISC). AGPL code may enter server
    components only; never SDKs, CLI or plugins. SSPL/BSL/commercial: rejected.
  - Start small. Every change is a thin vertical slice that runs locally and is tested the same day.
  - Local first: everything runs in `just up` (docker compose) before any cloud env exists.
    Cloud dev env (AWS) comes only when a change cannot be tested locally.
  - Agent transparency: every datastore, log and trace in the local stack is reachable by the coding
    agent through an MCP server or a `just` command (read-only by default). Prefer an existing MCP.
  - Token frugality: every task is tagged with its model tier: [haiku] fast execution (isolated, well-defined,
    research, tests, repetitive), [sonnet] default feature work, including most work on secret,
    auth and gateway paths, [opus] only hard, complex tasks (new crypto or protocol design, subtle security
    reasoning, cross-cutting design). Most tasks should be [sonnet] or [haiku].

rules:
  proposal:
    - "State the usable outcome: what a user or agent can do after this change that they could not before."
    - "List explicitly what is out of scope."
    - "Name the previous change it depends on (or \"none\")."
  design:
    - "Include a \"Decisions and evidence\" table: decision, alternatives rejected, evidence (source URL or spike)."
    - "Include an \"OSS used\" table: package, licence, version, last release date, why, AGPL check."
    - "Explain anything built in-house instead of reused, and what was searched for first."
    - "Include a \"How an agent debugs this\" section: the MCP servers, `just` commands, logs, traces and DB tables involved."
  tasks:
    - "Size each task to at most 30 minutes of agent work (one commit; a worker run takes several, and a change's PR carries many); tag each task [haiku], [sonnet] or [opus] (untagged means sonnet)."
    - "Contract first: when other roadmap rows need this change, task group 1 is \"Contract\" (that word in the heading): the OpenAPI schema, shared types and fixture or mock data that dependents build on, committed before any implementation. A change that needs only another change's contract lists `<id>:contract` in `x-depends_on`, stacks on that branch and builds against the mocks until the real code lands."
    - "Each task group ends with a verification task naming the exact local command (`just ...`, `cargo nextest ...`) that proves it."
    - "The last group is \"Local verification\" running `just up`, the change's smoke test, `just apps-build`, then `just ci`."
    - "Apps grow every change, never at the end: a change with user-facing behaviour adds its web console and desktop surface in the same change, and `just apps-build` (web + desktop on the host OS) must stay green. The last change of each phase also runs the manual `ci-platforms` workflow (macOS, Linux, Windows) and records the result in progress.md."
    - "Each change has an append-only progress.md (session log). Every session reads its last entries and git log first, and appends one entry before its final commit."
  specs:
    - "Every requirement has at least one scenario that maps to an automated test."
